# Lazurio's fork check (lazurio/README.md): the commit is an upstream stable
# release plus the overlay and the listed code patches, and the patches
# carry cleanly onto the newest upstream stable release, with their tests.
# Ready for when Actions are enabled in this fork for Lazurio's workflows
# only; until then the release's author runs both scripts by hand.
name: Lazurio upstream check
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Upstream tags
        run: git fetch --quiet --tags https://github.com/garrytan/gbrain.git
      - name: Current and newest upstream stable release
        id: tags
        run: |
          current=$(git tag --merged HEAD 'v*' | grep -v -- '-lazurio' | sort -V | tail -1)
          newest=$(git tag -l 'stable-v*' | sed 's/^stable-//' | sort -V | tail -1)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "current $current, newest stable $newest"
      - name: The fork check's package.json rule
        run: bash lazurio/package-diff.test.sh
      - name: Fork check
        run: bash lazurio/fork-check.sh "${{ steps.tags.outputs.current }}"
      - name: The patches carry onto the newest upstream stable release
        run: bash lazurio/upstream-check.sh "${{ steps.tags.outputs.current }}" "${{ steps.tags.outputs.newest }}" --test
